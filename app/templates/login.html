<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Solar Tracking</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: radial-gradient(circle at top right, #152942 0%, #0e1622 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card {
            background-color: rgba(21, 32, 48, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-green) 0%, var(--accent-cyan) 100%);
        }

        .login-logo {
            width: 130px;
            height: 130px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            background-color: #0e1622;
            border: 2px solid var(--border-color);
            padding: 4px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .login-logo:hover {
            transform: scale(1.05);
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(42, 203, 120, 0.3);
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .login-header h2 {
            font-family: var(--font-title);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .input-group-custom i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .input-group-custom .form-control {
            padding-left: 2.75rem;
        }

        .input-group-custom .form-control:focus + i {
            color: var(--accent-green);
        }

        .login-btn {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            padding: 0.85rem;
            width: 100%;
        }

        .login-alert {
            margin-bottom: 1.5rem;
            animation: shake 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Solar Tracking Logo">
            </div>
            
            <div class="login-header">
                <h2>Acesso ao Painel</h2>
                <p>Identifique-se para gerenciar o monitoramento solar</p>
            </div>

            <!-- Exibição de Mensagens Flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' or category == 'danger' else 'info' }} login-alert">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.login') }}">
                <div class="input-group-custom">
                    <input type="text" name="username" id="username" class="form-control" placeholder="Usuário" required autocomplete="username">
                    <i class="fa-solid fa-user"></i>
                </div>
                
                <div class="input-group-custom">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Senha" required autocomplete="current-password">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <button type="submit" class="btn btn-primary login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
